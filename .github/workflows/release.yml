name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Verify the release tag and merged commit
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          ruby -r ./lib/omniauth/whop/version -e 'abort "Tag/version mismatch" unless ENV.fetch("GITHUB_REF_NAME") == "v#{OmniAuth::Whop::VERSION}"'
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1
