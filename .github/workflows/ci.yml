name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
      - run: bundle exec rubocop
      - run: gem build omniauth-whop.gemspec

  minimum-dependencies:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/minimum.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle exec rake spec

  rails-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.2'
            rails: '~> 7.2.0'
            devise: '~> 4.9'
          - ruby: '3.3'
            rails: '~> 8.0.0'
            devise: '~> 5.0'
          - ruby: '3.4'
            rails: '~> 8.1.0'
            devise: '~> 5.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec ruby bin/test_rails
        env:
          RAILS_VERSION: ${{ matrix.rails }}
          DEVISE_VERSION: ${{ matrix.devise }}

  demo-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -f deploy/Dockerfile -t omniauth-whop:test .
      - name: Verify hosted demo
        run: |
          docker run -d --name omniauth-demo -p 127.0.0.1:9292:9292 \
            -e PUBLIC_URL=https://omniauth-ruby.whoptools.com \
            -e WHOP_CLIENT_ID=app_ci -e WHOP_CLIENT_SECRET=ci-placeholder \
            -e WHOP_SANDBOX=false -e SESSION_SECRET="$(openssl rand -hex 64)" omniauth-whop:test
          for attempt in 1 2 3 4 5; do
            if curl --fail http://127.0.0.1:9292/health; then break; fi
            sleep 2
          done
          python3 deploy/verify.py

  deployment-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash -n deploy/hetzner.sh && python3 deploy/test_deployment.py

  deploy:
    name: Deploy to Hetzner
    needs: [test, minimum-dependencies, rails-integration, demo-container, deployment-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: hetzner-production
      cancel-in-progress: false
    steps:
      - name: Configure deployment SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy tested main revision
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            omniauth-whop-deploy@188.245.75.73 "deploy $DEPLOY_SHA"
      - name: Check public health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 3 https://omniauth-ruby.whoptools.com/health > /dev/null
          curl --fail --silent --show-error https://pay-rails.whoptools.com/up > /dev/null
          curl --fail --silent --show-error https://webflow-checkout.whoptools.com/health > /dev/null
      - name: Remove deployment credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
